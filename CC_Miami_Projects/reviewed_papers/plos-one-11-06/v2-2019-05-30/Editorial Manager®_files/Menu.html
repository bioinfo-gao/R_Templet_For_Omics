	<script type="text/javascript" language="javascript">
	    function doRegister() {
	        window.open("PreRegistration.aspx", "content");

	    function open_help(theLink)
		{
			help_window = window.open(theLink, 'HELP', 'width=700, height=600, scrollbars=yes, resizable=yes');
			help_window.focus();
		}
		
		function checkLinkState(link)
	    {
			if (link.disabled == true) 
			{
				alert('Processing Information...\n\nPlease allow system to finish before navigating away from this page.');
				return false; 
			}
			else 
				return true;
		} 
		
		function cannotSubmitMS()
		{
			alert('\x27Submit a Manuscript\x27 is not available for this publication.');
		}
		
		function registerMsg()
		{
			alert('You have already registered for Editorial Manager If you want to Register another user, please logout first.');
		}

		
		var $disableLinksSelector = '#homeLink, #mainMenuLink, #submitManuscriptLink, #updateInfoLink';

		
		function $$disableNavigationControls()
		{
			var $accountLinks = $($disableLinksSelector);

			$accountLinks.each(function () {
				if ($(this).attr('href'))
				{
				    $(this).data('href', $(this).attr('href'));
                    
				    $(this).attr('href', 'javascript: return false;');
                }
			});
            $.blockUI2();
        }


		function $$enableNavigationControls()
		{
			var $accountLinks = $($disableLinksSelector);

			$accountLinks.each(function () {
				if ($(this).data('href'))
				{
					$(this).attr('href', $(this).data('href'));
				}
			});
            $.unblockUI2();
		}
